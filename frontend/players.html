<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - The Copper Shores</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="assets/fonts/crimson-text-400-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/crimson-text-600-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/cinzel-500-700-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/pirata-one-400-latin.woff2" as="font" type="font/woff2">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-logo" href="/index.html" title="Home">
                    <img src="assets/jollyrogercoppershores.png" alt="Copper Shores Home">
                </a>
                <h1 class="nav-title">The Copper Shores</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="gold.html" class="nav-link">Gold Spending</a></li>
                <li><a href="map.html" class="nav-link">Interactive Map</a></li>
                <li><a href="players.html" class="nav-link active">Players</a></li>
                <li><a href="notes.html" class="nav-link">Notes</a></li>
                <li><a href="content.html" class="nav-link">Library</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="panel-shell">
            <header class="panel-toolbar">
                <div class="title-stack">
                    <h1>Players</h1>
                    <p class="page-subtitle">Meet the crew sailing the Copper Shores.</p>
                </div>
                <button id="add-player-btn" class="btn">+ Add Player</button>
            </header>

            <div id="message"></div>

            <div class="table-shell">
                <table id="players-table" class="players-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Current Character</th>
                            <th>Bio</th>
                        </tr>
                    </thead>
                    <tbody id="players-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Add Player Form (hidden by default) -->
            <div id="add-player-form" class="form-panel is-hidden">
                <h3>Add Player</h3>
                <div class="field-stack">
                    <label>
                        <span>Player Name (required)</span>
                        <input id="input-player-name" type="text" placeholder="Player name">
                    </label>
                    <label>
                        <span>Bio / Notes</span>
                        <textarea id="input-player-bio" rows="3" placeholder="Short bio or notes"></textarea>
                    </label>

                    <fieldset class="fieldset-shell">
                        <legend>Optional: Current Character</legend>
                        <div class="field-grid">
                            <input id="input-char-name" type="text" placeholder="Character name">
                            <input id="input-char-race" type="text" placeholder="Race">
                            <input id="input-char-class" type="text" placeholder="Class">
                            <input id="input-char-level" type="number" min="1" placeholder="Level">
                        </div>
                    </fieldset>

                    <div class="button-row">
                        <button id="submit-add-player" class="btn">Save</button>
                        <button id="cancel-add-player" class="btn">Cancel</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 The Copper Shores. Version 0.1.0</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

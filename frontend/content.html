<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - The Copper Shores</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="assets/fonts/crimson-text-400-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/crimson-text-600-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/cinzel-500-700-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="assets/fonts/pirata-one-400-latin.woff2" as="font" type="font/woff2">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-logo" href="/index.html" title="Home">
                    <img src="assets/jollyrogercoppershores.png" alt="Copper Shores Home">
                </a>
                <h1 class="nav-title">The Copper Shores</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="gold.html" class="nav-link">Gold Spending</a></li>
                <li><a href="map.html" class="nav-link">Interactive Map</a></li>
                <li><a href="players.html" class="nav-link">Players</a></li>
                <li><a href="notes.html" class="nav-link">Notes</a></li>
                <li><a href="content.html" class="nav-link active">Library</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="panel-shell">
            <header class="page-header">
                <div class="title-stack">
                    <h1>D&amp;D Library</h1>
                    <p class="page-subtitle">Add monsters, NPCs, items, spells, lore, and other table-made discoveries.</p>
                </div>
                <button id="add-entry-btn" class="btn btn-primary">+ Add Entry</button>
            </header>

            <div id="message"></div>

            <div id="admin-token-panel" class="admin-token-panel">
                <label>
                    <span>Admin token</span>
                    <input id="admin-token-input" type="password" autocomplete="off" placeholder="Required only when configured on the server">
                </label>
                <div class="button-row">
                    <button id="save-admin-token" class="btn btn-secondary" type="button">Save Token</button>
                    <button id="clear-admin-token" class="btn btn-secondary" type="button">Clear</button>
                </div>
            </div>

            <div class="content-toolbar">
                <label>
                    <span>Type</span>
                    <select id="type-filter"></select>
                </label>
                <label>
                    <span>Search</span>
                    <input id="search-content" type="search" placeholder="Search title, text, or tags">
                </label>
            </div>

            <div class="content-layout">
                <div id="content-list" class="content-list"></div>
                <article id="content-detail" class="content-detail">
                    <p class="players-empty">Select an entry to inspect it.</p>
                </article>
            </div>
        </section>
    </main>

    <div id="entry-modal" class="modal-panel content-modal">
        <h3 id="entry-modal-title">Add Entry</h3>
        <div class="field-stack">
            <label>
                <span>Type</span>
                <select id="entry-type"></select>
            </label>
            <label>
                <span>Title</span>
                <input id="entry-title" type="text" maxlength="140">
            </label>
            <label>
                <span>Short summary</span>
                <input id="entry-summary" type="text" maxlength="500">
            </label>
            <label>
                <span>Content</span>
                <textarea id="entry-content" rows="9"></textarea>
            </label>
            <label>
                <span>Tags</span>
                <input id="entry-tags" type="text" placeholder="comma, separated, tags">
            </label>
            <label>
                <span>Created by</span>
                <input id="entry-created-by" type="text" maxlength="80" placeholder="Optional">
            </label>
            <label>
                <span>Details JSON</span>
                <textarea id="entry-details" rows="5" placeholder='{"cr":"3","school":"Evocation","rarity":"Rare"}'></textarea>
            </label>
        </div>
        <div class="button-row">
            <button id="save-entry" class="btn btn-primary" type="button">Save</button>
            <button id="cancel-entry" class="btn btn-secondary" type="button">Cancel</button>
        </div>
    </div>
    <div id="entry-modal-overlay" class="modal-overlay"></div>

    <footer class="footer">
        <p>&copy; 2026 The Copper Shores. Version 0.1.0</p>
    </footer>

    <script src="script.js"></script>
    <script src="content.js"></script>
</body>
</html>

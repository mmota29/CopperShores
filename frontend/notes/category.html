<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Category - The Copper Shores</title>
    <link rel="stylesheet" href="/shared/styles/global.css">
    <link rel="preload" href="/shared/assets/fonts/crimson-text-400-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="/shared/assets/fonts/crimson-text-600-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="/shared/assets/fonts/cinzel-500-700-latin.woff2" as="font" type="font/woff2">
    <link rel="preload" href="/shared/assets/fonts/pirata-one-400-latin.woff2" as="font" type="font/woff2">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-logo" href="/" title="Home">
                    <img src="/shared/assets/jollyrogercoppershores.png" alt="Copper Shores Home">
                </a>
                <h1 class="nav-title">The Copper Shores</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/treasury/" class="nav-link">Treasury</a></li>
                <li><a href="/maps/" class="nav-link">Interactive Map</a></li>
                <li><a href="/players/" class="nav-link">Players</a></li>
                <li><a href="/notes/" class="nav-link active">Notes</a></li>
                <li><a href="/library/" class="nav-link">Library</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="panel-shell">
            <header class="page-header">
                <div class="title-stack">
                    <a href="/notes/" class="btn btn-secondary">&larr; Back to Categories</a>
                    <h1 id="category-title">Notes</h1>
                </div>
                <button id="add-note-btn" class="btn">+ Add Note</button>
            </header>

            <div class="search-shell">
                <input id="search-notes" type="text" placeholder="Search notes...">
            </div>

            <div id="message"></div>

            <div id="notes-list" class="notes-list">
                <!-- Populated by JS -->
            </div>
        </section>
    </main>

    <!-- Add Note Form -->
    <div id="add-note-modal" class="modal-panel">
        <h3>Add Note</h3>
        <div class="field-stack">
            <label>
                <span>Title (required)</span>
                <input id="add-note-title" type="text">
            </label>
            <label>
                <span>Content</span>
                <textarea id="add-note-content" rows="6"></textarea>
            </label>
            <label>
                <span>Tags (comma-separated)</span>
                <input id="add-note-tags" type="text" placeholder="npc, important, quest">
            </label>
        </div>
        <div class="button-row">
            <button id="submit-add-note" class="btn">Save</button>
            <button id="cancel-add-note" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
    <div id="add-modal-overlay" class="modal-overlay"></div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 The Copper Shores. Version 0.1.0</p>
    </footer>

    <script src="/shared/scripts/app.js"></script>
    <script>
        let currentCategory = null;
        let allNotes = [];

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(location.search);
            currentCategory = params.get('cat') || 'pc';
            window.__CURRENT_CATEGORY = currentCategory;

            initNotesCategory();
        });

        document.getElementById('add-note-btn').addEventListener('click', () => {
            document.getElementById('add-note-modal').style.display = 'block';
            document.getElementById('add-modal-overlay').style.display = 'block';
        });

        document.getElementById('cancel-add-note').addEventListener('click', closeAddNoteModal);
        document.getElementById('add-modal-overlay').addEventListener('click', closeAddNoteModal);
        document.getElementById('submit-add-note').addEventListener('click', submitAddNote);
        document.getElementById('search-notes').addEventListener('input', filterNotes);

        function initNotesCategory() {
            getCategoryLabel(currentCategory);
            loadNotesList();
        }

        function getCategoryLabel(cat) {
            fetch(`${API_BASE_URL}/notes/categories`)
                .then(r => r.json())
                .then(resp => {
                    if (resp.status === 'success' && resp.data[cat]) {
                        document.getElementById('category-title').textContent = resp.data[cat];
                    }
                });
        }

        function loadNotesList() {
            fetch(`${API_BASE_URL}/notes/${currentCategory}`)
                .then(r => r.json())
                .then(resp => {
                    if (resp.status !== 'success') {
                        showMessage('Failed to load notes', true);
                        return;
                    }
                    allNotes = resp.data.notes || [];
                    renderNotesList(allNotes);
                })
                .catch(() => showMessage('Network error', true));
        }

        function renderNotesList(notes) {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            if (!notes.length) {
                list.innerHTML = '<p class="players-empty">No notes yet. Click "+ Add Note" to create one.</p>';
                return;
            }
            notes.forEach(note => {
                const row = document.createElement('div');
                row.className = 'note-row';
                row.onclick = () => {
                    window.location = `/notes/detail.html?cat=${currentCategory}&id=${note.id}`;
                };
                const snippet = truncate(note.content, 80);
                const info = document.createElement('div');
                info.className = 'note-info';

                const title = document.createElement('div');
                title.className = 'note-title';
                title.textContent = note.title || 'Untitled';

                const noteSnippet = document.createElement('div');
                noteSnippet.className = 'note-snippet';
                noteSnippet.textContent = snippet || '(no content)';

                info.appendChild(title);
                info.appendChild(noteSnippet);

                if (note.tags && note.tags.length) {
                    const tags = document.createElement('div');
                    tags.className = 'note-tags';
                    tags.textContent = `Tags: ${note.tags.join(', ')}`;
                    info.appendChild(tags);
                }

                row.appendChild(info);
                list.appendChild(row);
            });
        }

        function filterNotes() {
            const query = document.getElementById('search-notes').value.toLowerCase();
            const filtered = allNotes.filter(n =>
                n.title.toLowerCase().includes(query) ||
                n.content.toLowerCase().includes(query) ||
                (n.tags && n.tags.some(t => t.toLowerCase().includes(query)))
            );
            renderNotesList(filtered);
        }

        function submitAddNote() {
            const title = document.getElementById('add-note-title').value || '';
            if (!title.trim()) {
                showMessage('Note title is required', true);
                return;
            }
            const content = document.getElementById('add-note-content').value || '';
            const tagsStr = document.getElementById('add-note-tags').value || '';
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) : [];

            fetch(`${API_BASE_URL}/notes/${currentCategory}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, tags })
            })
            .then(r => r.json())
            .then(resp => {
                if (resp.status === 'success') {
                    showMessage('Note added');
                    closeAddNoteModal();
                    loadNotesList();
                } else {
                    showMessage(resp.message || 'Failed to add', true);
                }
            })
            .catch(() => showMessage('Network error', true));
        }

        function closeAddNoteModal() {
            document.getElementById('add-note-modal').style.display = 'none';
            document.getElementById('add-modal-overlay').style.display = 'none';
            document.getElementById('add-note-title').value = '';
            document.getElementById('add-note-content').value = '';
            document.getElementById('add-note-tags').value = '';
        }

        function showMessage(msg, isError) {
            const el = document.getElementById('message');
            el.textContent = '';
            const p = document.createElement('p');
            p.className = `status-message ${isError ? 'error' : 'success'}`;
            p.textContent = msg;
            el.appendChild(p);
            setTimeout(() => { el.textContent = ''; }, 4000);
        }

        function truncate(text, n = 80) {
            if (!text) return '';
            return text.length > n ? text.slice(0, Math.max(0, n - 3)) + '...' : text;
        }
    </script>
</body>
</html>
